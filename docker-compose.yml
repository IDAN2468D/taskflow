services:
  # 1. שרת ה-Spring Boot (נבנה ישירות מה-Dockerfile של הפרויקט)
  app:
    build: .
    container_name: taskflow-app
    ports:
      - "8080:8080"
    environment:
      # תקשורת פנימית ישירה בתוך רשת ה-Docker לפי שמות השירותים
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/taskflow_db
      - SPRING_DATASOURCE_USERNAME=taskflow_user
      - SPRING_DATASOURCE_PASSWORD=taskflow_password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      # כאן מוסיפים את המשתנה - Docker יקרא אותו אוטומטית מקובץ ה-.env:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - kafka
      - elasticsearch
    restart: unless-stopped

  # 2. מסד הנתונים PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: taskflow_db
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: taskflow_password
    ports:
      - "5433:5432"
    volumes:
      - taskflow_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # 3. מנוע האירועים Apache Kafka
  kafka:
    image: apache/kafka:3.7.0
    container_name: taskflow-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    restart: unless-stopped

  # 4. מנוע החיפוש Elasticsearch
  elasticsearch:
    image: elasticsearch:8.11.3
    container_name: taskflow-elasticsearch
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    depends_on:
      - app # וודא שזה תואם לשם השירות של ה-Java שלך (app או backend)
volumes:
  taskflow_pgdata: