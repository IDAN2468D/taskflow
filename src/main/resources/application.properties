# חיבור לשרת PostgreSQL שרץ ב-Docker על פורט 5433
spring.datasource.url=jdbc:postgresql://localhost:5433/taskflow_db
spring.datasource.username=taskflow_user
spring.datasource.password=taskflow_password
spring.datasource.driver-class-name=org.postgresql.Driver

# הגדרות Hibernate עבור PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# הגבלת גודל קבצים
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# הגדרות Apache Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=taskflow-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# הגדרת מפתח Google Gemini API
gemini.api-key=${GEMINI_API_KEY:}