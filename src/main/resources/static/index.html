<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro - AI Powered</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">

<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">

    <!-- Header -->
    <header class="bg-gradient-to-r from-indigo-600 to-purple-600 px-6 py-5 text-white flex justify-between items-center shadow-sm">
        <div>
            <h1 class="text-2xl font-black tracking-tight flex items-center gap-2">
                <span>TaskFlow AI</span>
                <span class="text-[10px] bg-purple-500/50 px-2 py-0.5 rounded-full border border-purple-300">LLM Integrated</span>
            </h1>
            <p class="text-indigo-200 text-xs mt-0.5">Spring Boot • Kafka • Elasticsearch • AI Assistant</p>
        </div>
        <div id="userBadge" class="hidden flex items-center gap-3">
            <span id="loggedInUsername" class="text-sm font-semibold bg-indigo-700/80 px-3 py-1 rounded-full border border-indigo-500"></span>
            <button onclick="logout()" class="text-xs bg-indigo-800 hover:bg-rose-600 px-3 py-1.5 rounded-lg transition font-medium">התנתק</button>
        </div>
    </header>

    <main class="p-6">

        <!-- מסך התחברות / הרשמה -->
        <section id="authSection" class="max-w-md mx-auto py-8">
            <div class="bg-slate-50 border border-slate-200 p-6 rounded-2xl shadow-sm text-center">
                <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl font-bold">🔒</div>
                <h2 class="text-xl font-bold text-slate-800 mb-1">כניסה למערכת</h2>
                <p class="text-xs text-slate-500 mb-5">התחבר כדי לצפות במשימות ולנהל את עוזר ה-AI שלך</p>

                <div class="space-y-3.5 text-right">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">שם משתמש:</label>
                        <input type="text" id="authUsername" placeholder="למשל: IdanKazam" class="w-full px-4 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">סיסמה:</label>
                        <input type="password" id="authPassword" placeholder="••••••••" class="w-full px-4 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button onclick="login()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition text-sm shadow-sm">התחבר</button>
                        <button onclick="register()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2.5 rounded-xl transition text-sm">הרשמה</button>
                    </div>
                    <p id="authMessage" class="text-xs text-center font-medium mt-2 min-h-[16px]"></p>
                </div>
            </div>
        </section>

        <!-- מסך המשימות וה-AI -->
        <section id="appSection" class="hidden space-y-5">

            <!-- כרטיסיית עוזר ה-AI החדשה! -->
            <div class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 p-4 rounded-2xl border border-purple-200 shadow-sm space-y-3">
                <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-purple-700 flex items-center gap-1.5">
                            <span class="text-sm">🤖</span> AI Smart Task Breakdown
                        </span>
                    <span class="text-[10px] text-purple-500 font-medium">GenAI Feature (Part B)</span>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="aiPromptInput" placeholder="הקלד יעד כללי (למשל: הכנה לראיון ב-Java, תכנון מעבר דירה)..."
                           class="flex-1 px-3.5 py-2 rounded-xl border border-purple-200 focus:ring-2 focus:ring-purple-500 focus:outline-none text-xs bg-white">
                    <button onclick="askAi()" id="aiBtn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-4 py-2 rounded-xl transition text-xs shadow-sm whitespace-nowrap">
                        ✨ פרק עם AI
                    </button>
                </div>

                <!-- אזור תוצאות ה-AI -->
                <div id="aiSuggestionsArea" class="hidden bg-white/80 p-3.5 rounded-xl border border-purple-200 space-y-2.5">
                    <div class="flex items-center justify-between border-b border-purple-100 pb-1.5">
                        <span class="text-xs font-bold text-slate-700">תתי-משימות שהופקו על ידי ה-AI:</span>
                        <button onclick="addAllAiTasks()" class="text-xs text-purple-600 hover:text-purple-800 font-bold underline">
                            + הוסף את כל המשימות לרשימה
                        </button>
                    </div>
                    <div id="aiSuggestionsList" class="space-y-1.5"></div>
                </div>
            </div>

            <!-- טופס הוספת משימה רגילה + קובץ -->
            <form id="createTaskForm" class="bg-slate-50 p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <input type="text" id="taskTitle" required placeholder="כותרת המשימה..." class="w-full px-4 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                <input type="text" id="taskDescription" placeholder="תיאור המשימה (אופציונלי)..." class="w-full px-4 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border border-dashed border-slate-300">
                    <span class="text-sm">📎</span>
                    <input type="file" id="taskFile" class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer w-full">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-xl transition text-sm shadow-sm">
                    + שמור משימה
                </button>
            </form>

            <!-- חיפוש ב-Elasticsearch -->
            <div class="relative">
                <input type="text" id="searchInput" oninput="handleSearch(this.value)"
                       placeholder="🔍 חפש ב-Elasticsearch (כותרת או תיאור)..."
                       class="w-full pl-4 pr-10 py-2.5 rounded-xl border border-indigo-200 bg-indigo-50/50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition">
                <span id="searchIndicator" class="absolute left-3 top-2.5 text-xs text-indigo-500 hidden">מחפש...</span>
            </div>

            <!-- סרגל סינון וספירה -->
            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                <div class="flex gap-1.5">
                    <button onclick="setFilter(null)" id="filterAll" class="px-3 py-1 rounded-lg text-xs font-bold bg-indigo-600 text-white">הכל</button>
                    <button onclick="setFilter(false)" id="filterActive" class="px-3 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">פעילות</button>
                    <button onclick="setFilter(true)" id="filterCompleted" class="px-3 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">הושלמו</button>
                </div>
                <span id="taskCounter" class="text-xs font-bold bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full border border-indigo-200">0 משימות</span>
            </div>

            <!-- רשימת המשימות -->
            <ul id="tasksList" class="space-y-3"></ul>

        </section>
    </main>
</div>

<script>
    const AUTH_API = '/api/auth';
    const TASKS_API = '/api/tasks';
    let currentFilter = null;
    let searchTimeout = null;
    let currentAiSuggestions = [];

    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('jwt_token');
        const username = localStorage.getItem('username');
        if (token && username) {
            showApp(username);
        }
    });

    function getAuthHeaders() {
        return { 'Authorization': `Bearer ${localStorage.getItem('jwt_token')}` };
    }

    async function login() {
        const username = document.getElementById('authUsername').value.trim();
        const password = document.getElementById('authPassword').value;
        const msg = document.getElementById('authMessage');

        try {
            const res = await fetch(`${AUTH_API}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('jwt_token', data.token);
                localStorage.setItem('username', data.username);
                showApp(data.username);
            } else {
                msg.textContent = 'שם משתמש או סיסמה שגויים';
                msg.className = 'text-xs text-center font-medium mt-2 text-rose-500';
            }
        } catch (e) {
            msg.textContent = 'שגיאת רשת בחיבור לשרת';
            msg.className = 'text-xs text-center font-medium mt-2 text-rose-500';
        }
    }

    async function register() {
        const username = document.getElementById('authUsername').value.trim();
        const password = document.getElementById('authPassword').value;
        const msg = document.getElementById('authMessage');

        try {
            const res = await fetch(`${AUTH_API}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (res.ok) {
                msg.textContent = 'נרשמת בהצלחה! כעת לחץ על התחבר.';
                msg.className = 'text-xs text-center font-medium mt-2 text-emerald-600';
            } else {
                const error = await res.text();
                msg.textContent = error || 'שגיאה בהרשמה';
                msg.className = 'text-xs text-center font-medium mt-2 text-rose-500';
            }
        } catch (e) {
            msg.textContent = 'שגיאת רשת';
            msg.className = 'text-xs text-center font-medium mt-2 text-rose-500';
        }
    }

    function logout() {
        localStorage.clear();
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('userBadge').classList.add('hidden');
        document.getElementById('authMessage').textContent = '';
    }

    function showApp(username) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('userBadge').classList.remove('hidden');
        document.getElementById('loggedInUsername').textContent = `שלום, ${username}`;
        fetchTasks();
    }

    // ================== מודול ה-AI ==================
    async function askAi() {
        const input = document.getElementById('aiPromptInput');
        const prompt = input.value.trim();
        const btn = document.getElementById('aiBtn');
        if (!prompt) return;

        btn.disabled = true;
        btn.textContent = 'חושב... 🧠';

        try {
            const res = await fetch(`${TASKS_API}/ai-suggest`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...getAuthHeaders()
                },
                body: JSON.stringify({ prompt })
            });

            if (res.ok) {
                currentAiSuggestions = await res.json();
                renderAiSuggestions(currentAiSuggestions);
            } else {
                alert('שגיאה בקבלת מענה מה-AI');
            }
        } catch (err) {
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.textContent = '✨ פרק עם AI';
        }
    }

    function renderAiSuggestions(suggestions) {
        const area = document.getElementById('aiSuggestionsArea');
        const list = document.getElementById('aiSuggestionsList');
        list.innerHTML = '';

        suggestions.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'p-2.5 bg-white rounded-lg border border-purple-100 flex items-start justify-between text-xs';
            div.innerHTML = `
                    <div>
                        <span class="font-bold text-purple-900">${item.title}</span>
                        <p class="text-slate-500 mt-0.5">${item.description}</p>
                    </div>
                    <button onclick="addSingleAiTask(${index})" class="text-indigo-600 hover:text-indigo-800 font-bold whitespace-nowrap mr-2">
                        + הוסף
                    </button>
                `;
            list.appendChild(div);
        });

        area.classList.remove('hidden');
    }

    async function addSingleAiTask(index) {
        const item = currentAiSuggestions[index];
        if (!item) return;

        await fetch(TASKS_API, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                ...getAuthHeaders()
            },
            body: JSON.stringify({ title: item.title, description: item.description })
        });

        fetchTasks();
    }

    async function addAllAiTasks() {
        for (const item of currentAiSuggestions) {
            await fetch(TASKS_API, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...getAuthHeaders()
                },
                body: JSON.stringify({ title: item.title, description: item.description })
            });
        }
        document.getElementById('aiSuggestionsArea').classList.add('hidden');
        document.getElementById('aiPromptInput').value = '';
        fetchTasks();
    }

    // ================== חיפוש ב-Elasticsearch ==================
    function handleSearch(query) {
        clearTimeout(searchTimeout);
        if (!query.trim()) {
            fetchTasks();
            return;
        }

        document.getElementById('searchIndicator').classList.remove('hidden');
        searchTimeout = setTimeout(async () => {
            try {
                const res = await fetch(`${TASKS_API}/search?query=${encodeURIComponent(query)}`, {
                    headers: getAuthHeaders()
                });

                if (res.ok) {
                    const esResult = await res.json();
                    const hits = esResult.hits?.hits || [];
                    const tasks = hits.map(h => ({
                        id: h._source.taskId,
                        title: h._source.title,
                        description: h._source.description,
                        completed: false
                    }));
                    renderTasks(tasks, true);
                }
            } catch (e) {
                console.error('שגיאת חיפוש:', e);
            } finally {
                document.getElementById('searchIndicator').classList.add('hidden');
            }
        }, 300);
    }

    async function fetchTasks() {
        let url = TASKS_API;
        if (currentFilter !== null) url += `?completed=${currentFilter}`;

        try {
            const res = await fetch(url, { headers: getAuthHeaders() });
            if (res.status === 401 || res.status === 403) {
                logout();
                return;
            }
            const tasks = await res.json();
            if (Array.isArray(tasks)) renderTasks(tasks, false);
        } catch (err) {
            console.error(err);
        }
    }

    function setFilter(status) {
        currentFilter = status;
        document.getElementById('filterAll').className = status === null ? 'px-3 py-1 rounded-lg text-xs font-bold bg-indigo-600 text-white' : 'px-3 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200';
        document.getElementById('filterActive').className = status === false ? 'px-3 py-1 rounded-lg text-xs font-bold bg-indigo-600 text-white' : 'px-3 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200';
        document.getElementById('filterCompleted').className = status === true ? 'px-3 py-1 rounded-lg text-xs font-bold bg-indigo-600 text-white' : 'px-3 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200';
        fetchTasks();
    }

    function renderTasks(tasks, isSearchResult) {
        const list = document.getElementById('tasksList');
        const counter = document.getElementById('taskCounter');
        list.innerHTML = '';
        counter.textContent = isSearchResult ? `${tasks.length} תוצאות חיפוש ב-Elasticsearch` : `${tasks.length} משימות`;

        if (tasks.length === 0) {
            list.innerHTML = `<li class="text-center text-slate-400 py-8 text-sm">אין משימות להצגה.</li>`;
            return;
        }

        tasks.forEach(task => {
            const li = document.createElement('li');
            li.className = `p-3.5 rounded-xl border transition flex flex-col gap-2 ${
                task.completed ? 'bg-slate-50 border-slate-200 opacity-65' : 'bg-white border-slate-200 shadow-sm'
            }`;

            li.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-start gap-3">
                            <input type="checkbox" ${task.completed ? 'checked' : ''}
                                   onchange="toggleTask(${task.id}, '${task.title}', '${task.description || ''}', this.checked)"
                                   class="w-5 h-5 mt-0.5 text-indigo-600 rounded cursor-pointer">
                            <div>
                                <h4 class="font-bold text-slate-800 text-sm ${task.completed ? 'line-through text-slate-500' : ''}">${task.title}</h4>
                                ${task.description ? `<p class="text-xs text-slate-500 mt-0.5">${task.description}</p>` : ''}
                            </div>
                        </div>
                        <button onclick="deleteTask(${task.id})" class="text-rose-500 hover:text-rose-700 text-xs font-bold px-2 py-1 rounded hover:bg-rose-50 transition">
                            מחק
                        </button>
                    </div>

                    ${task.attachmentFileName ? `
                        <div class="mr-8 pt-1 flex items-center gap-2">
                            <button onclick="downloadAttachment(${task.id}, '${task.attachmentFileName}')"
                                    class="text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-200 text-slate-700 px-2.5 py-1 rounded-lg flex items-center gap-1.5 transition">
                                <span>📎</span>
                                <span class="truncate max-w-[200px]">${task.attachmentFileName.split('_').slice(1).join('_') || task.attachmentFileName}</span>
                                <span class="text-[10px] text-indigo-600 font-bold mr-1">הורד</span>
                            </button>
                        </div>
                    ` : ''}
                `;
            list.appendChild(li);
        });
    }

    document.getElementById('createTaskForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const titleInput = document.getElementById('taskTitle');
        const descInput = document.getElementById('taskDescription');
        const fileInput = document.getElementById('taskFile');

        btn.disabled = true;
        btn.textContent = 'שומר...';

        try {
            const res = await fetch(TASKS_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
                body: JSON.stringify({ title: titleInput.value.trim(), description: descInput.value.trim() })
            });

            if (res.ok) {
                const createdTask = await res.json();
                if (fileInput.files.length > 0) {
                    const formData = new FormData();
                    formData.append('file', fileInput.files[0]);
                    await fetch(`${TASKS_API}/${createdTask.id}/attachment`, {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: formData
                    });
                }
                titleInput.value = '';
                descInput.value = '';
                fileInput.value = '';
                fetchTasks();
            }
        } catch (err) {
            console.error('שגיאה:', err);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<span>+</span> שמור משימה';
        }
    });

    async function toggleTask(id, title, description, completed) {
        await fetch(`${TASKS_API}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
            body: JSON.stringify({ title, description, completed })
        });
        fetchTasks();
    }

    async function deleteTask(id) {
        if (!confirm('האם למחוק משימה זו?')) return;
        await fetch(`${TASKS_API}/${id}`, {
            method: 'DELETE',
            headers: getAuthHeaders()
        });
        fetchTasks();
    }

    async function downloadAttachment(taskId, originalFileName) {
        try {
            const res = await fetch(`${TASKS_API}/${taskId}/attachment`, { headers: getAuthHeaders() });
            if (res.ok) {
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = originalFileName.split('_').slice(1).join('_') || originalFileName;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            }
        } catch (err) {
            alert('שגיאה בהורדת הקובץ');
        }
    }
</script>
</body>
</html>
